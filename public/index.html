<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Astra · Personal Assistant</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header><div class="brand"><span class="mark">✦</span><div><b>ASTRA</b><small>PERSONAL ASSISTANT</small></div></div><div class="header-actions"><button type="button" id="install" hidden>Install app</button><span class="pill" id="status">Connecting…</span></div></header><section class="stage"><div class="halo"><div class="portrait" id="portrait"><div class="hair"></div><div class="face"><span class="eyes"><i></i><i></i></span><span class="nose"></span><span class="mouth"></span></div><div class="neck"></div><div class="shoulders"></div></div></div><div class="live"><span class="dot"></span><span id="activity">Ready to talk</span></div><h1>Your ideas, spoken aloud.</h1><p class="subtitle">Ask a question by voice or text. Astra responds in your language.</p></section><section class="controls"><label>Mode <select id="mode"><option value="auto">Auto (offline first)</option><option value="offline">Offline only</option><option value="online">Online router</option></select></label><label class="check"><input type="checkbox" id="shareNotes"> Share notes with online model</label><button type="button" id="download">Download offline starter model</button><span id="models">Checking local models…</span></section><details class="memory"><summary>Personal notes on this computer</summary><form id="noteForm"><input id="noteTitle" maxlength="100" placeholder="Title" required><textarea id="noteContent" maxlength="4000" placeholder="Your note. Avoid passwords and OTPs." required></textarea><button type="submit">Save note</button></form><div id="noteList"></div></details><section class="chat" id="chat" aria-live="polite"><div class="bubble assistant">হ্যালো! আমি Astra। প্রশ্ন লিখতে বা mic চেপে বলতে পারো।</div></section><form id="form"><button type="button" id="mic" title="Speak" aria-label="Speak">🎙</button><input id="input" autocomplete="off" placeholder="Ask me anything…" maxlength="4000" required><button class="send" type="submit" aria-label="Send">➤</button></form><footer><button id="sound" type="button">🔊 Voice on</button><button id="clear" type="button">Clear chat</button><span>Voice recognition depends on your browser.</span></footer></main><script src="/app.js"></script></body></html>
